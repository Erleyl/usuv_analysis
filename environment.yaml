name: usuv_env
channels:
  - bioconda
  - conda-forge
  #- defaults
dependencies:
  - python=3.10
  - pip
  #- numpy
  - pandas
  - ncbi-datasets-cli
  - seqkit>=2.4.0
  - mafft
  - iqtree
  #- treetime sometimes causes issues when trying to install MacOS native

  # R is needed for `main.sh --lab` (scripts/prepare_lab_fasta.R)
  - r-base
  - r-dplyr
  - r-stringr

  # Optional: For visual check of the tree in terminal
  - gotree
  - ape
